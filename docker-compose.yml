version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shelfsense_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "2977"
      POSTGRES_DB: shelfsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    driver: local
